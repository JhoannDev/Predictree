# Configuración de herramientas (no se usa para instalar paquetes: para eso está requirements.txt).

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# E/F: errores básicos · I: orden de imports · UP: sintaxis moderna · B: errores comunes
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Tablas de supuestos y textos del reporte: más legibles en una sola línea.
"app/simulacion/*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
